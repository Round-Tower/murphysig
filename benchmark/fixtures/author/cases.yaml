# Author-quality (write-side) cases — hazard-planted coding tasks.
# Each hazard is objectively checkable in code: the judge scores it
# handled-in-code or missed. Promoted from scratch/jam-2026-07-08-author-quality.
#
# ADVERSARIALLY AUDITED 2026-08-22 (two independent challenger passes):
#   - billing H2 was collinear with H1 (48/48 identical pilot verdicts) —
#     replaced with year-boundary rollover, an independent hazard.
#   - duration H2 tightened from "handle or reject" (satisfiable by any
#     implementation, decided by unstated judge philosophy) to an explicit
#     decidable criterion.
#   - split_amount added: hazards that are ceiling-proof at flagship level
#     because naive code is WRONG (sum invariant), not merely undefended.
# Publishable-run gate cleared. See fixtures/author/PREREGISTRATION.md.

cases:
  - id: duration
    task: >-
      Write a function `parse_duration(s: str) -> int` that parses a
      duration string like '1h30m', '45s', or '2h' into total seconds.
      Supported units: h (hours), m (minutes), s (seconds).
    hazards:
      H1: >-
        Invalid input (empty string, garbage text, unknown unit, bare
        number with no unit) — code must validate and give it defined
        behavior (e.g. raise ValueError), not crash obscurely or
        silently return a wrong number.
      H2: >-
        Repeated units ('1h1h') and reversed order ('30m1h'). Score
        handled ONLY if the code contains an explicit check that detects
        a repeated unit, or a strict full-string pattern that constrains
        unit order. A findall-and-sum that silently accepts both is
        missed, even if the sum is arithmetically sensible.
      H3: >-
        Missing or negative magnitude ('h' alone, '-5m') — code must not
        silently mis-parse; defined behavior required.

  - id: paginate
    task: >-
      Write a function `paginate(items: list, page: int, per_page: int)
      -> dict` that returns {'items': <the page of items>, 'page': page,
      'total_pages': <int>} for 1-indexed pages.
    hazards:
      H1: >-
        per_page <= 0 — must not raise ZeroDivisionError or loop; needs
        validation / defined behavior.
      H2: >-
        page out of range (0, negative, or greater than total_pages) —
        needs defined behavior (clamp, empty page, or raise), not a
        silent wrong slice.
      H3: >-
        Empty items list — total_pages should have a deliberate,
        consistent value (0 or 1) and the function must not crash.

  - id: billing
    task: >-
      Write a function `next_billing_date(start: datetime.date,
      months_ahead: int) -> datetime.date` that returns the billing date
      `months_ahead` months after `start`, keeping the same day-of-month.
    hazards:
      H1: >-
        Month-end overflow (Jan 31 + 1 month) — must clamp to the last
        valid day (e.g. Feb 28) or otherwise define behavior; naive
        date.replace(month=...) crashes.
      H2: >-
        Year-boundary rollover — months_ahead pushing past December
        (e.g. Oct 31 + 4 months must land in February of the NEXT year).
        Naive month + months_ahead without divmod yields month 14 and
        raises; a wrong year is a silent failure.
      H3: >-
        months_ahead <= 0 — defined behavior (allow going backwards, or
        validate and raise), not an accident.

  - id: split_amount
    task: >-
      Write a function `split_amount(total_cents: int, n: int) ->
      list[int]` that splits an amount of money into n integer parts as
      evenly as possible.
    hazards:
      H1: >-
        The parts must sum EXACTLY to total_cents — total_cents // n * n
        != total_cents for most inputs, so the remainder must be
        distributed across parts, not dropped. A plain [total // n] * n
        loses money and is missed.
      H2: >-
        Negative total_cents — Python floor division rounds toward
        negative infinity, so a naive remainder distribution breaks the
        exact-sum invariant on negatives. Score handled only if the sum
        invariant demonstrably holds for negative totals (correct
        handling or explicit validation/rejection of negatives).
      H3: >-
        n <= 0 — validation with defined behavior, not a
        ZeroDivisionError or a silent empty list.
