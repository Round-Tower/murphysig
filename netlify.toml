[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /init → /init.sh so users can `curl -sL https://murphysig.dev/init | bash`
[[redirects]]
  from = "/init"
  to = "/init.sh"
  status = 200
  force = true

# /sign → /sign.md so users can `curl -sL https://murphysig.dev/sign >> CLAUDE.md`
# (drop-in "AI agent, sign your work" instruction snippet; vendor-neutral name
# avoids the macOS case-insensitive claude.md/CLAUDE.md collision)
[[redirects]]
  from = "/sign"
  to = "/sign.md"
  status = 200
  force = true

# Badge fallback: pre-rendered badges (real files at /badge/<owner>/<repo>.svg)
# win because force is off; anything else gets the "not found" badge.
# Never calls GitHub at request time — registry refresh is a nightly Action.
[[redirects]]
  from = "/badge/*"
  to = "/badge-not-found.svg"
  status = 200

[[headers]]
  for = "/init.sh"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"
    Cache-Control = "public, max-age=300"

# Serve the agent snippet as plain text so it displays in-browser and curls clean.
# EXACT paths only — the old glob "/sign*" also matched /signed/* and served the
# whole registry section as text/plain (raw HTML in the browser, found 2026-07-02).
[[headers]]
  for = "/sign"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/sign.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

# Site-wide CSP, Report-Only until a deploy has run clean, then rename the key
# to Content-Security-Policy. The two inline scripts Astro emits are pinned by
# sha256 (no 'unsafe-inline' for script — /signed/ pages render third-party
# registry content). style-src keeps 'unsafe-inline' for Astro's style="" attrs.
# site/scripts/check-csp.mjs runs in CI after the build and fails if any page
# needs something this policy doesn't allow (e.g. a changed inline script).
# When several [[headers]] blocks match a path, a later block's value for the
# SAME header name wins (observed: /badge/* Cache-Control beats /*.svg). The
# badge block below sets the enforcing Content-Security-Policy, a different
# header name, so it is never weakened by this one; keep this block above it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw=' 'sha256-Bw9PH/AVnU4WninGTAvNVumb+gbECejwi7KrDYF0L40='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Badges refresh nightly — cache for an hour so updates propagate same-day.
# They're built from third-party registry data: escaped at build time
# (site/src/lib/escape.mjs), and this CSP is the backstop — a directly opened
# SVG can never run script, even if escaping regresses.
[[headers]]
  for = "/badge/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; sandbox"
