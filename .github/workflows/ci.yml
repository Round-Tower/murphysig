name: CI

# The correctness gate. Auto-merge of dependency PRs is contingent on this
# passing (see dependabot-automerge.yml). main auto-deploys via Netlify, so a
# red CI here is the line between "shipped" and "shipped broken".

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: benchmark (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        # ruff pinned on purpose: an unpinned 0.16 release widened the default
        # rules and failed Lint on unchanged code, silently blocking every
        # Dependabot auto-merge (incl. the astro critical). Bump the pin in its
        # own PR, with the code fixed to match — 0.16.10 since 2026-10-06.
        run: pip install -e ".[dev,providers]" ruff==0.16.10
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q

  site:
    name: site (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Escape + CSP tests (registry content is third-party)
        run: node --test src/lib/*.test.mjs
      - run: npm run build
      - name: Built pages are allowed by the site CSP
        # Fails on a changed inline script (stale sha256 pin in netlify.toml)
        # or a new external origin, before the policy is ever enforced.
        run: node scripts/check-csp.mjs
